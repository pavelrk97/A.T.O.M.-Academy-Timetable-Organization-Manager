name: Deploy

on:
  push:
    branches: [main, engl-version]
    paths:
      - 'frontend/**'
      - 'docker-compose.prod.yml'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/atom-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy on server over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /root/A.T.O.M.-Academy-Timetable-Organization-Manager
            git fetch origin ${{ github.ref_name }}
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            docker compose -f docker-compose.prod.yml pull frontend
            docker compose -f docker-compose.prod.yml up -d frontend
            docker image prune -f

      - name: Rebuild backend & monitoring on server (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 40m
          script: |
            set -e
            cd /root/A.T.O.M.-Academy-Timetable-Organization-Manager
            swapon /swapfile 2>/dev/null || true
            free -h
            grep -q '^GRAFANA_ADMIN_PASSWORD=' .env || { echo "ERROR: GRAFANA_ADMIN_PASSWORD не задан в серверном .env"; exit 1; }
            docker compose -f docker-compose.prod.yml up --build -d api-gateway schedule-service identity-service import-service
            docker compose -f docker-compose.prod.yml up -d loki promtail prometheus grafana
            docker compose -f docker-compose.prod.yml restart reverse-proxy
            docker compose -f docker-compose.prod.yml ps
            # 4 JVM на 2 CPU поднимаются долго и конкурируют за процессор — ждём готовности gateway до 10 минут.
            code=000
            for i in $(seq 1 60); do
              code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8081/api/public/schedule?from=2026-07-01&to=2026-07-02" || true)
              [ "$code" = "200" ] && { echo "gateway готов за ~$((i*10))с"; break; }
              echo "прогрев ${i}/60: gateway=$code"
              sleep 10
            done
            docker compose -f docker-compose.prod.yml logs schedule-service --tail 20 | grep -iE "flyway|started" || true
            echo "gateway healthcheck: $code"
            [ "$code" = "200" ]

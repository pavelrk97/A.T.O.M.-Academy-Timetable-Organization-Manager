services:
  postgres:
    image: postgres:16-alpine
    container_name: atom-postgres
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  identity-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        MODULE_PATH: identity-service
        MODULE_ARTIFACT: identity-service
    container_name: atom-identity-service
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      IDENTITY_INTERNAL_API_KEY: ${IDENTITY_INTERNAL_API_KEY}
    ports:
      - "8082:8082"
    volumes:
      - ./db/migration:/app/db/migration:ro

  schedule-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        MODULE_PATH: schedule-import-parser-core
        MODULE_ARTIFACT: schedule-service
    container_name: atom-schedule-service
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"
    depends_on:
      postgres:
        condition: service_healthy
      identity-service:
        condition: service_started
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      IDENTITY_SERVICE_URL: ${IDENTITY_SERVICE_URL}
      IDENTITY_INTERNAL_API_KEY: ${IDENTITY_INTERNAL_API_KEY}
      SCHEDULE_INTERNAL_API_KEY: ${SCHEDULE_INTERNAL_API_KEY}
      ATOM_IMPORT_ARCHIVE_DIR: ${ATOM_IMPORT_ARCHIVE_DIR}
    ports:
      - "8080:8080"
    volumes:
      - ./db/migration:/app/db/migration:ro
      - schedule-import-archive:/app/data/import-archive

  import-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        MODULE_PATH: import-service
        MODULE_ARTIFACT: import-service
    container_name: atom-import-service
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"
    depends_on:
      identity-service:
        condition: service_started
      schedule-service:
        condition: service_started
    env_file:
      - .env
    environment:
      IDENTITY_SERVICE_URL: ${IDENTITY_SERVICE_URL}
      SCHEDULE_SERVICE_URL: ${SCHEDULE_SERVICE_URL}
      IDENTITY_INTERNAL_API_KEY: ${IDENTITY_INTERNAL_API_KEY}
      SCHEDULE_INTERNAL_API_KEY: ${SCHEDULE_INTERNAL_API_KEY}
    ports:
      - "8083:8083"

  api-gateway:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        MODULE_PATH: schedule-api-service
        MODULE_ARTIFACT: api-gateway
    container_name: atom-api-gateway
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"
    depends_on:
      identity-service:
        condition: service_started
      schedule-service:
        condition: service_started
      import-service:
        condition: service_started
    env_file:
      - .env
    environment:
      IDENTITY_SERVICE_URL: ${IDENTITY_SERVICE_URL}
      SCHEDULE_SERVICE_URL: ${SCHEDULE_SERVICE_URL}
      IMPORT_SERVICE_URL: ${IMPORT_SERVICE_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8081:8081"

  loki:
    image: grafana/loki:3.0.0
    container_name: atom-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki

  promtail:
    image: grafana/promtail:3.0.0
    container_name: atom-promtail
    restart: unless-stopped
    privileged: true
    depends_on:
      - loki
    ports:
      - "9080:9080"
    volumes:
      - ./docker/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: atom-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.1.0
    container_name: atom-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./docker/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./docker/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: atom-node-exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

volumes:
  postgres-data:
  schedule-import-archive:
  loki-data:
  prometheus-data:
  grafana-data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: atom-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrations:
    image: flyway/flyway:10-alpine
    container_name: atom-migrations
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    command:
      - -url=jdbc:postgresql://postgres:${POSTGRES_PORT}/${POSTGRES_DB}
      - -user=${POSTGRES_USER}
      - -password=${POSTGRES_PASSWORD}
      - -connectRetries=60
      - migrate
    volumes:
      - ./db/migration:/flyway/sql:ro

  identity-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        MODULE_PATH: identity-service
        MODULE_ARTIFACT: identity-service
    container_name: atom-identity-service
    restart: unless-stopped
    depends_on:
      migrations:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      IDENTITY_INTERNAL_API_KEY: ${IDENTITY_INTERNAL_API_KEY}
    ports:
      - "8082:8082"

  schedule-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        MODULE_PATH: schedule-import-parser-core
        MODULE_ARTIFACT: schedule-service
    container_name: atom-schedule-service
    restart: unless-stopped
    depends_on:
      migrations:
        condition: service_completed_successfully
      identity-service:
        condition: service_started
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      IDENTITY_SERVICE_URL: ${IDENTITY_SERVICE_URL}
      IDENTITY_INTERNAL_API_KEY: ${IDENTITY_INTERNAL_API_KEY}
      SCHEDULE_INTERNAL_API_KEY: ${SCHEDULE_INTERNAL_API_KEY}
      ATOM_IMPORT_ARCHIVE_DIR: ${ATOM_IMPORT_ARCHIVE_DIR}
    ports:
      - "8080:8080"
    volumes:
      - schedule-import-archive:/app/data/import-archive

  import-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        MODULE_PATH: import-service
        MODULE_ARTIFACT: import-service
    container_name: atom-import-service
    restart: unless-stopped
    depends_on:
      identity-service:
        condition: service_started
      schedule-service:
        condition: service_started
    env_file:
      - .env
    environment:
      IDENTITY_SERVICE_URL: ${IDENTITY_SERVICE_URL}
      SCHEDULE_SERVICE_URL: ${SCHEDULE_SERVICE_URL}
      IDENTITY_INTERNAL_API_KEY: ${IDENTITY_INTERNAL_API_KEY}
      SCHEDULE_INTERNAL_API_KEY: ${SCHEDULE_INTERNAL_API_KEY}
    ports:
      - "8083:8083"

  api-gateway:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        MODULE_PATH: schedule-api-service
        MODULE_ARTIFACT: api-gateway
    container_name: atom-api-gateway
    restart: unless-stopped
    depends_on:
      identity-service:
        condition: service_started
      schedule-service:
        condition: service_started
      import-service:
        condition: service_started
    env_file:
      - .env
    environment:
      IDENTITY_SERVICE_URL: ${IDENTITY_SERVICE_URL}
      SCHEDULE_SERVICE_URL: ${SCHEDULE_SERVICE_URL}
      IMPORT_SERVICE_URL: ${IMPORT_SERVICE_URL}
    ports:
      - "8081:8081"

volumes:
  postgres-data:
  schedule-import-archive:

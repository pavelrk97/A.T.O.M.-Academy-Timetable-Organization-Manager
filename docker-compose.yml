services:
  postgres:
    image: postgres:16-alpine
    container_name: atom-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  identity-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        MODULE_PATH: identity-service
        MODULE_ARTIFACT: identity-service
    container_name: atom-identity-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      IDENTITY_INTERNAL_API_KEY: ${IDENTITY_INTERNAL_API_KEY}
    ports:
      - "8082:8082"
    volumes:
      - ./db/migration:/app/db/migration:ro

  kafka:
    image: apache/kafka:3.8.1
    container_name: atom-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m

  schedule-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        MODULE_PATH: schedule-import-parser-core
        MODULE_ARTIFACT: schedule-service
    container_name: atom-schedule-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      identity-service:
        condition: service_started
      kafka:
        condition: service_started
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      IDENTITY_SERVICE_URL: ${IDENTITY_SERVICE_URL}
      IDENTITY_INTERNAL_API_KEY: ${IDENTITY_INTERNAL_API_KEY}
      SCHEDULE_INTERNAL_API_KEY: ${SCHEDULE_INTERNAL_API_KEY}
      ATOM_IMPORT_ARCHIVE_DIR: ${ATOM_IMPORT_ARCHIVE_DIR}
      ATOM_KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "8080:8080"
    volumes:
      - ./db/migration:/app/db/migration:ro
      - schedule-import-archive:/app/data/import-archive

  import-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        MODULE_PATH: import-service
        MODULE_ARTIFACT: import-service
    container_name: atom-import-service
    restart: unless-stopped
    depends_on:
      identity-service:
        condition: service_started
      schedule-service:
        condition: service_started
    env_file:
      - .env
    environment:
      IDENTITY_SERVICE_URL: ${IDENTITY_SERVICE_URL}
      SCHEDULE_SERVICE_URL: ${SCHEDULE_SERVICE_URL}
      IDENTITY_INTERNAL_API_KEY: ${IDENTITY_INTERNAL_API_KEY}
      SCHEDULE_INTERNAL_API_KEY: ${SCHEDULE_INTERNAL_API_KEY}
    ports:
      - "8083:8083"

  api-gateway:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        MODULE_PATH: schedule-api-service
        MODULE_ARTIFACT: api-gateway
    container_name: atom-api-gateway
    restart: unless-stopped
    depends_on:
      identity-service:
        condition: service_started
      schedule-service:
        condition: service_started
      import-service:
        condition: service_started
    env_file:
      - .env
    environment:
      IDENTITY_SERVICE_URL: ${IDENTITY_SERVICE_URL}
      SCHEDULE_SERVICE_URL: ${SCHEDULE_SERVICE_URL}
      IMPORT_SERVICE_URL: ${IMPORT_SERVICE_URL}
    ports:
      - "8081:8081"

volumes:
  postgres-data:
  schedule-import-archive:

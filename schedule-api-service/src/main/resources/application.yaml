server:
  port: 8081

schedule:
  service:
    url: ${SCHEDULE_SERVICE_URL:http://localhost:8080}

identity:
  service:
    url: ${IDENTITY_SERVICE_URL:http://localhost:8082}

import:
  service:
    url: ${IMPORT_SERVICE_URL:http://localhost:8083}

security:
  jwt:
    secret: ${JWT_SECRET:dev-jwt-secret-key-dev-jwt-secret-key-123456}

spring:
  application:
    name: api-gateway
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

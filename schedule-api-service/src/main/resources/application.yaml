server:
  port: 8081
  forward-headers-strategy: framework

schedule:
  service:
    url: ${SCHEDULE_SERVICE_URL:http://localhost:8080}

identity:
  service:
    url: ${IDENTITY_SERVICE_URL:http://localhost:8082}

import:
  service:
    url: ${IMPORT_SERVICE_URL:http://localhost:8083}

gemini:
  base-url: https://generativelanguage.googleapis.com/v1beta
  # gemini-3.5-flash-lite выбран как free-tier модель с лимитом 500 RPD
  # в текущем Google AI Studio project; избегаем latest-алиаса с меньшей квотой.
  model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
  api-key: ${GEMINI_API_KEY:}

security:
  jwt:
    secret: ${JWT_SECRET:dev-jwt-secret-key-dev-jwt-secret-key-123456}

spring:
  application:
    name: api-gateway
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 10000
            # Запуск авто-импорта (/api/auto-import/run) синхронно гоняет полный импорт CSV
            # и на слабом сервере легко выходит за дефолтные 60 секунд — gateway отваливался
            # с "Downstream service call failed", хотя импорт на schedule-service доходил до конца.
            readTimeout: 300000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

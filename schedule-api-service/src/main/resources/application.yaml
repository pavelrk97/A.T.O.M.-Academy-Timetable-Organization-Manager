server:
  port: 8081

schedule:
  service:
    url: http://localhost:8080

identity:
  service:
    url: http://localhost:8082

import:
  service:
    url: http://localhost:8083

spring:
  application:
    name: api-gateway
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

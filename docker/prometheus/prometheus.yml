global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "atom-services"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - identity-service:8082
          - schedule-service:8080
          - import-service:8083
          - api-gateway:8081

  - job_name: "node"
    static_configs:
      - targets:
          - node-exporter:9100

server:
  port: 8083

identity:
  service:
    url: ${IDENTITY_SERVICE_URL:http://localhost:8082}
    api-key: ${IDENTITY_INTERNAL_API_KEY:dev-internal-api-key}

schedule:
  service:
    url: ${SCHEDULE_SERVICE_URL:http://localhost:8080}
    api-key: ${SCHEDULE_INTERNAL_API_KEY:dev-schedule-internal-api-key}

spring:
  application:
    name: import-service
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

logging:
  level:
    root: INFO
    org.springframework.security: INFO

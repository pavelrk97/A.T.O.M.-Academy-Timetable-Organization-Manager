services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  identity-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        MODULE_PATH: identity-service
        MODULE_ARTIFACT: identity-service
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      IDENTITY_INTERNAL_API_KEY: ${IDENTITY_INTERNAL_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./db/migration:/app/db/migration:ro

  schedule-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        MODULE_PATH: schedule-import-parser-core
        MODULE_ARTIFACT: schedule-service
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"
    depends_on:
      postgres:
        condition: service_healthy
      identity-service:
        condition: service_started
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      IDENTITY_SERVICE_URL: ${IDENTITY_SERVICE_URL}
      IDENTITY_INTERNAL_API_KEY: ${IDENTITY_INTERNAL_API_KEY}
      SCHEDULE_INTERNAL_API_KEY: ${SCHEDULE_INTERNAL_API_KEY}
      ATOM_IMPORT_ARCHIVE_DIR: ${ATOM_IMPORT_ARCHIVE_DIR}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./db/migration:/app/db/migration:ro
      - schedule-import-archive:/app/data/import-archive

  import-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        MODULE_PATH: import-service
        MODULE_ARTIFACT: import-service
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"
    depends_on:
      identity-service:
        condition: service_started
      schedule-service:
        condition: service_started
    env_file:
      - .env
    environment:
      IDENTITY_SERVICE_URL: ${IDENTITY_SERVICE_URL}
      SCHEDULE_SERVICE_URL: ${SCHEDULE_SERVICE_URL}
      IDENTITY_INTERNAL_API_KEY: ${IDENTITY_INTERNAL_API_KEY}
      SCHEDULE_INTERNAL_API_KEY: ${SCHEDULE_INTERNAL_API_KEY}
      JWT_SECRET: ${JWT_SECRET}

  api-gateway:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        MODULE_PATH: schedule-api-service
        MODULE_ARTIFACT: api-gateway
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"
    depends_on:
      identity-service:
        condition: service_started
      schedule-service:
        condition: service_started
      import-service:
        condition: service_started
    env_file:
      - .env
    environment:
      IDENTITY_SERVICE_URL: ${IDENTITY_SERVICE_URL}
      SCHEDULE_SERVICE_URL: ${SCHEDULE_SERVICE_URL}
      IMPORT_SERVICE_URL: ${IMPORT_SERVICE_URL}
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

  frontend:
    image: ghcr.io/pavelrk97/atom-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_started
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      ATOM_GATEWAY_URL: http://api-gateway:8081

  loki:
    image: grafana/loki:3.0.0
    restart: unless-stopped
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki

  promtail:
    image: grafana/promtail:3.0.0
    restart: unless-stopped
    privileged: true
    depends_on:
      - loki
    volumes:
      - ./docker/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    env_file:
      - .env
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://${PUBLIC_HOSTNAME}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./docker/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

  reverse-proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
      api-gateway:
        condition: service_started
      grafana:
        condition: service_started
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  schedule-import-archive:
  caddy-data:
  caddy-config:
  loki-data:
  prometheus-data:
  grafana-data:

server:
  port: 8082

internal:
  security:
    api-key: ${IDENTITY_INTERNAL_API_KEY:dev-internal-api-key}

security:
  jwt:
    secret: ${JWT_SECRET:dev-jwt-secret-key-dev-jwt-secret-key-123456}
    issuer: ${JWT_ISSUER:atom-identity-service}
    access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:120}

spring:
  application:
    name: identity-service
  profiles:
    active: dev
  flyway:
    enabled: false

---

spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:atom}
    username: ${POSTGRES_USER:dbuser}
    password: ${POSTGRES_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: filesystem:db/migration,filesystem:../db/migration

---

spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:atom}
    username: ${POSTGRES_USER:dbuser}
    password: ${POSTGRES_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: filesystem:/app/db/migration

logging:
  level:
    root: INFO
    org.springframework.security: INFO

server:
  port: 8080

atom:
  import:
    archive-dir: ${ATOM_IMPORT_ARCHIVE_DIR:${user.home}/atom-import-archive}

internal:
  security:
    api-key: ${SCHEDULE_INTERNAL_API_KEY:dev-schedule-internal-api-key}

security:
  jwt:
    secret: ${JWT_SECRET:dev-jwt-secret-key-dev-jwt-secret-key-123456}

identity:
  service:
    url: ${IDENTITY_SERVICE_URL:http://localhost:8082}
    api-key: ${IDENTITY_INTERNAL_API_KEY:dev-internal-api-key}

spring:
  application:
    name: schedule-service
  profiles:
    active: dev
  flyway:
    enabled: false

---

spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:atom}
    username: ${POSTGRES_USER:dbuser}
    password: ${POSTGRES_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

  flyway:
    enabled: true
    locations: filesystem:db/migration,filesystem:../db/migration

---

spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:atom}
    username: ${POSTGRES_USER:dbuser}
    password: ${POSTGRES_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

logging:
  level:
    root: INFO
    org.springframework.security: INFO

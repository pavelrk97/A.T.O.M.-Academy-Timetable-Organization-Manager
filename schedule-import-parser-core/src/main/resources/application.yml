server:
  port: 8080

atom:
  import:
    archive-dir: ${ATOM_IMPORT_ARCHIVE_DIR:${user.home}/atom-import-archive}

internal:
  security:
    api-key: ${SCHEDULE_INTERNAL_API_KEY:dev-schedule-internal-api-key}

identity:
  service:
    url: http://localhost:8082
    api-key: ${IDENTITY_INTERNAL_API_KEY:dev-internal-api-key}

spring:
  application:
    name: schedule-service
  profiles:
    active: dev

---

spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:file:~/atom-shared-db;AUTO_SERVER=TRUE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  h2:
    console:
      enabled: true
      path: /h2-console

  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

---

spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://localhost:5432/atom
    username: dbuser
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

logging:
  level:
    root: INFO
    org.springframework.security: INFO
